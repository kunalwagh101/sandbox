name: Verify delivery evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify board and evidence
        run: python scripts/verify_board.py
      - name: Run verifier tests
        run: python -m unittest discover -s tests -v

  powershell-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse every PowerShell file with Windows PowerShell
        shell: powershell
        run: |
          $allErrors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List -Force
            throw "$($allErrors.Count) PowerShell parse error(s)"
          }
      - name: Run source contract tests
        run: python -m unittest discover -s tests -v
